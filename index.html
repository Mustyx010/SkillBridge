<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#731F94" />
  <title>SkillBridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --brand: #731F94; }
    html, body { height: 100%; margin: 0; }
    body { font-family: "Plus Jakarta Sans", system-ui, sans-serif; overflow: hidden; background: #fff; }

    /* Layer 1: white screen, purple logo */
    .mark-in  { animation: reveal 900ms cubic-bezier(.22, 1, .36, 1) 300ms both; }
    .word-in  { animation: rise 600ms ease-out 900ms both; }

    /* Layer 2: purple screen floods out from the centre, logo flips to white */
    .flood {
      clip-path: circle(0% at 50% 50%);
      animation: flood 1100ms cubic-bezier(.65, 0, .35, 1) 2000ms both;
    }

    @keyframes reveal {
      from { clip-path: inset(0 50% 0 50%); opacity: 0; transform: scale(.88); }
      to   { clip-path: inset(0 0 0 0);     opacity: 1; transform: none; }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes flood {
      to { clip-path: circle(150% at 50% 50%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .mark-in, .word-in { animation: none; }
      .flood { animation: none; clip-path: circle(150% at 50% 50%); }
    }
  </style>
</head>

  <main class="relative h-full w-full" aria-label="SkillBridge">
    <!-- Layer 1 -->
    <section class="absolute inset-0 flex flex-col items-center justify-center gap-4 bg-white" style="color: var(--brand)">
      <svg class="mark-in w-24 md:w-28" viewBox="0 0 118 131" role="img" aria-label="SkillBridge logomark">
        <use href="#logomark" />
      </svg>
      <span class="word-in text-xl md:text-2xl font-bold tracking-tight">SkillBridge</span>
    </section>

    <!-- Layer 2 -->
    <section class="flood absolute inset-0 flex flex-col items-center justify-center gap-4 text-white" style="background: var(--brand)" aria-hidden="true">
      <svg class="w-24 md:w-28" viewBox="0 0 118 131">
        <use href="#logomark" />
      </svg>
      <span class="text-xl md:text-2xl font-bold tracking-tight">SkillBridge</span>
    </section>
  </main>

  <script>
    // Where to go once the intro finishes: first-time visitors see the onboarding slides,
    // returning visitors (who already finished or skipped them) go straight to sign up.
    let seenOnboarding = false;
    try { seenOnboarding = localStorage.getItem("skillbridge:onboarded") === "1"; } catch (_) {}
    const NEXT_URL = seenOnboarding ? "signup.html" : "onboarding.html";
    const TOTAL_MS = 3600; // 2000ms delay + 1100ms flood + ~500ms hold

    if (NEXT_URL) {
      const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      // replace() (not assign()) so the splash isn't left in history: Back from signup won't replay it.
      setTimeout(() => window.location.replace(NEXT_URL), reduced ? 800 : TOTAL_MS);
    }
  </script>

</html>
